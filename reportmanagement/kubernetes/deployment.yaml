apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feedservice
  template:
    metadata:
      labels:
        app: feedservice
    spec:
      containers:
      - name: feedservice
        image: team05registry.azurecr.io/feedservice:v2
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: feedservice
spec:
  type: LoadBalancer
  selector:
    app: feedservice
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080