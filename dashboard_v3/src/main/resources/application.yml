server:
  port: 8080

spring:
  application:
    name: dashboard
---

spring:
  config:
    activate:
      on-profile: default
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          configuration:
            auto.offset.reset: earliest
      bindings:
          event-in:              
            group: dashboard
            destination: fireresponsesystem
            contentType: application/json  
          event-out:
            destination: fireresponsesystem
            contentType: application/json
logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug
    org.springframework.kafka: debug
    org.apache.kafka: debug
    org.springframework.cloud.stream: debug
    fireresponsesystem: debug


server:
  port: 8088

---

spring:
  config:
    activate:
      on-profile: docker
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
          configuration:
            auto.offset.reset: earliest
      bindings:
          event-in:              
            group: dashboard
            destination: fireresponsesystem
            contentType: application/json  
          event-out:
            destination: fireresponsesystem
            contentType: application/json
            
---
spring:
  config:
    import: optional:classpath:application-secret.yml
