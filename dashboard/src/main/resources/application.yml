server:
  port: 8080

spring:
  application:
    name: dashboard
---

spring:
  profiles: default
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: dashboard
          destination: fireresponsesystem
          contentType: application/json
        event-out:
          destination: fireresponsesystem
          contentType: application/json

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug


server:
  port: 8088

---

spring:
  profiles: docker
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
  cloud:
    stream:
      kafka:
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: dashboard
          destination: fireresponsesystem
          contentType: application/json
        event-out:
          destination: fireresponsesystem
          contentType: application/json


---
spring:
  cloud:
    stream:
      kafka:
        binder:
          brokers: team05kafka.servicebus.windows.net:9093
          configuration:
            security.protocol: SASL_SSL
            sasl.mechanism: PLAIN
            sasl.jaas.config: >
              org.apache.kafka.common.security.plain.PlainLoginModule required
              username="$ConnectionString"
              password="${AZURE_EVENT_HUB_CONNECTION_STRING}";
            client.dns.lookup: use_all_dns_ips
            request.timeout.ms: 60000
            retry.backoff.ms: 500
          consumer-properties:
            value.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            spring.json.trusted.packages: fireresponsesystem.domain,*
            spring.json.use.type.headers: true
            spring.json.value.default.type: java.lang.Object
      bindings:
        event-in:
          group: dashboard
          destination: fireresponsesystem
          contentType: application/json
        event-out:
          destination: fireresponsesystem
          contentType: application/json