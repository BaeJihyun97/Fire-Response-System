apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification
        image: team05registry.azurecr.io/notification:v1
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  type: LoadBalancer
  selector:
    app: notification
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080